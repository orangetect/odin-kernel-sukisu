name: Build odin kernel with SukiSU-Ultra (5.4 + SUSFS)

on:
  workflow_dispatch:
    inputs:
      sukisu_ref:
        description: 'SukiSU-Ultra git ref (tag or branch)'
        required: false
        default: 'v4.3.0-r2'
      kernel_repo:
        description: 'kernel source repo (owner/name)'
        required: false
        default: 'Inkypen79/kernel_xiaomi_odin'
      kernel_ref:
        description: 'kernel source ref (resukisu required: ships SUSFS v2.1.0)'
        required: false
        default: 'resukisu'
      ksu_version:
        description: 'KSU version reported to manager/ksud (must match v4.3.0-r2 = 41150)'
        required: false
        default: '41150'
      embed_ksud:
        description: 'Embed matching ksud from the SukiSU release into AnyKernel3'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Checkout kernel source
        run: |
          git clone --depth 1 --branch "${{ inputs.kernel_ref || 'resukisu' }}" \
            "https://github.com/${{ inputs.kernel_repo || 'Inkypen79/kernel_xiaomi_odin' }}.git" kernel
          echo "kernel HEAD: $(git -C kernel rev-parse --short HEAD)"

      - name: Clone SukiSU-Ultra into KernelSU/
        run: |
          rm -rf kernel/KernelSU
          git clone --depth 1 --branch "${{ inputs.sukisu_ref || 'v4.3.0-r2' }}" \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git kernel/KernelSU
          # KSU_VERSION is 40000 + commit-count - 2815; a shallow clone would
          # report 37186 and the manager would reject the kernel.  Unshallow
          # also makes the tag/main version calculation deterministic.
          git -C kernel/KernelSU fetch --unshallow --tags 2>/dev/null || true
          echo "SukiSU commits: $(git -C kernel/KernelSU rev-list --count HEAD)"
          echo "SukiSU HEAD: $(git -C kernel/KernelSU rev-parse --short HEAD)"
          echo "SukiSU tag : $(git -C kernel/KernelSU describe --tags --always 2>/dev/null || echo unknown)"

      - name: Integrate SukiSU on odin 5.4
        run: |
          chmod +x ci/scripts/sukisu-setup.py
          python3 ci/scripts/sukisu-setup.py --kernel "$PWD/kernel"

      - name: Verify 5.4/SUSFS source markers
        run: |
          K=kernel/KernelSU/kernel
          fail=0
          check() {
            if ! grep -q "$1" "$2"; then
              echo "::error::$3"
              fail=1
            fi
          }
          check 'KSU54_SELINUX_POLICY_SHIM' "$K/selinux/sepolicy.h" 'sepolicy.h 5.4 policy shim missing'
          check 'KSU54_POLICY_FIELD' "$K/selinux/rules.c" 'rules.c 5.4 policy accessors missing'
          check 'ksu54_sepolicy_backport' "$K/selinux/sepolicy.c" 'sepolicy.c 5.4 backport missing'
          check 'ksu54_selinux_hide_54' "$K/feature/selinux_hide.c" 'selinux_hide.c 5.4 shim missing'
          check 'ksu54_pmd_sect' "$K/hook/arm64/patch_memory.c" 'patch_memory.c 5.4 block-PMD fix missing'
          check 'ksu54_sucompat_pgtable' "$K/feature/sucompat.c" 'sucompat.c 5.4 pgtable include fallback missing'
          check 'ksu54_pkg_observer_fsnotify' "$K/manager/pkg_observer.c" 'pkg_observer.c 5.4 fsnotify handle_event shim missing'
          check 'ksu54_allowlist_task' "$K/policy/allowlist.c" 'allowlist.c 5.4 sched/task.h include missing'
          check 'ksu54_cpu_spoof_vdso' "$K/extension/cpu_spoof.c" 'cpu_spoof.c 5.4 clocksource guard missing'
          check 'ksu54_filename_trans' "$K/selinux/sepolicy.c" 'sepolicy.c 5.4 filename transition fallback missing'
          check 'ksu54_dispatch_task' "$K/supercall/dispatch.c" 'dispatch.c 5.4 tasklist includes missing'
          check 'ksu54_susfs_sid' "$K/selinux/selinux.c" 'SUSFS SID globals used by avc.c missing'
          check 'ksu54_path_mount' "$K/infra/su_mount_ns.c" '5.4 do_mount fallback missing'
          check 'ksu54_header_shim' "kernel/include/linux/minmax.h" '5.4 minmax.h header shim missing'
          check 'ksu54_header_shim' "kernel/include/linux/hex.h" '5.4 hex.h header shim missing'
          check 'susfs_is_current_ksu_domain' "$K/selinux/selinux.c" 'SUSFS domain wrapper missing'
          check 'config KSU_SUSFS' "$K/Kconfig" 'KSU_SUSFS Kconfig missing'
          check 'susfs_init();' "$K/core/init.c" 'susfs_init() call missing'
          check 'ksu_handle_susfs_command' "$K/extension/susfs_extension.c" 'SUSFS command dispatcher missing'
          check 'SUSFS_MAGIC' "$K/supercall/supercall.c" 'SUSFS reboot hook missing'
          check 'susfs_start_sdcard_monitor_fn' "$K/runtime/boot_event.c" 'SUSFS sdcard monitor call missing'
          check 'susfs_set_current_proc_umounted' "$K/hook/setuid_hook.c" 'SUSFS app-process marking missing'
          if grep -q 'ksu_handle_execveat' kernel/fs/exec.c; then
            echo "::error::legacy ksu_handle_execveat call site still present in fs/exec.c"
            fail=1
          fi
          if grep -q 'ksu_handle_stat' kernel/fs/stat.c; then
            echo "::error::legacy ksu_handle_stat call site still present in fs/stat.c"
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "source markers: PASS"

      - name: Scheduler patches
        run: |
          chmod +x ci/scripts/sched-tune.sh ci/scripts/power-tune.sh
          bash ci/scripts/sched-tune.sh "$PWD/kernel" || echo "::warning::sched patches partially applied"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential flex bison libssl-dev \
            libelf-dev bc zip unzip python3 cpio rsync device-tree-compiler \
            git curl wget xz-utils liblz4-dev zlib1g-dev libncurses-dev \
            linux-libc-dev || true
          sudo ldconfig || true
          if ! ldconfig -p | grep -q 'libxml2.so.2'; then
            for pkg in libxml2-dev libxml2-2 libxml2-16 libxml2t64; do
              sudo apt-get install -y -qq "$pkg" 2>/dev/null || true
            done
            sudo ldconfig || true
          fi
          if ! ldconfig -p | grep -q 'libxml2.so.2'; then
            LIB=$(find /usr/lib /lib -name 'libxml2.so*' 2>/dev/null | head -1)
            if [ -n "$LIB" ]; then
              sudo ln -sf "$(readlink -f "$LIB")" /usr/lib/x86_64-linux-gnu/libxml2.so.2 || true
              sudo ldconfig || true
            else
              echo "::error::libxml2.so.2 unavailable"
              exit 1
            fi
          fi
          ldconfig -p | grep libxml2 || true

      - name: Download Clang (ZyCromerZ)
        run: |
          mkdir -p "$HOME/toolchain"
          cd "$HOME/toolchain"
          curl -sSL --retry 5 --retry-delay 5 -o clang.tar.gz \
            https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20261022-release/Clang-14.0.6-20261022.tar.gz
          tar -xzf clang.tar.gz
          rm -f clang.tar.gz
          CLANG_BIN=$(find "$HOME/toolchain" -maxdepth 4 -name clang \( -type f -o -type l \) | head -1)
          if [ -z "$CLANG_BIN" ]; then
            echo "::error::clang binary not found"
            exit 1
          fi
          TCDIR=$(dirname "$CLANG_BIN")
          echo "TCBIN=$TCDIR" >> "$GITHUB_ENV"
          "$TCDIR/clang" --version

      - name: Fast compile gate (KSU objects)
        run: |
          cd kernel
          export PATH="$TCBIN:$PATH"
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1
          export CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf

          make -j"$(nproc)" O=out odin_defconfig
          ./scripts/config --file out/.config \
            --enable KPROBES --enable KSU \
            --disable KSU_TRACEPOINT_HOOK --disable KSU_MANUAL_HOOK \
            --enable KSU_SUSFS \
            --enable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable KSU_SUSFS_OPEN_REDIRECT \
            --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_SUS_KSTAT \
            --enable KSU_SUSFS_SUS_MAP \
            --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_SUS_PATH
          make -j"$(nproc)" O=out olddefconfig

          # power-tune edits out/.config, so it must run after odin_defconfig.
          bash ../ci/scripts/power-tune.sh "$PWD" || echo "::warning::power tune skipped"

          make -j"$(nproc)" O=out security/selinux/
          make -j"$(nproc)" O=out drivers/kernelsu/
          echo "=== fast gate: PASS ==="

      - name: Resolve SukiSU version
        id: sukisu_version
        env:
          SUKISU_REF: ${{ inputs.sukisu_ref || 'v4.3.0-r2' }}
          KSU_VERSION_INPUT: ${{ inputs.ksu_version || '41150' }}
        run: |
          if [ "$SUKISU_REF" = "main" ]; then
            count=$(git -C kernel/KernelSU rev-list --count HEAD)
            value=$((40000 + count - 2815))
            full="main-$(git -C kernel/KernelSU rev-parse --short HEAD)"
          else
            value="$KSU_VERSION_INPUT"
            full="$SUKISU_REF"
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "SukiSU version: $value ($full)"

      - name: Build kernel
        run: |
          cd kernel
          export PATH="$TCBIN:$PATH"
          export ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1
          export CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf

          KSU_VERSION="${{ steps.sukisu_version.outputs.value }}"
          KSU_VERSION_FULL="${{ steps.sukisu_version.outputs.full }}"
          NEKO_VER="SukiSU-$(date +%Y%m%d)-$(od -An -N2 -tu2 /dev/urandom | tr -d ' ')"
          echo "NEKO_VER=$NEKO_VER" >> "$GITHUB_ENV"
          echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_ENV"

          make -j"$(nproc)" O=out odin_defconfig
          ./scripts/config --file out/.config --set-str LOCALVERSION ""
          ./scripts/config --file out/.config --disable LOCALVERSION_AUTO
          ./scripts/config --file out/.config \
            --enable KPROBES --enable KSU \
            --disable KSU_TRACEPOINT_HOOK --disable KSU_MANUAL_HOOK \
            --enable KSU_SUSFS \
            --enable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable KSU_SUSFS_OPEN_REDIRECT \
            --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_SUS_KSTAT \
            --enable KSU_SUSFS_SUS_MAP \
            --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_SUS_PATH
          make -j"$(nproc)" O=out olddefconfig

          # SukiSU Kbuild has VERSION_BASE=40000 / OFFSET=2815; the release
          # tag is pinned to 41150, main is derived from its full commit count.
          make -j"$(nproc)" O=out LOCALVERSION="-$NEKO_VER" \
            KSU_VERSION="$KSU_VERSION" KSU_VERSION_FULL="$KSU_VERSION_FULL" \
            Image Image.gz

          grep -E '^CONFIG_(KSU|KSU_SUSFS|KPROBES|EXT4_FS)=' out/.config || true
          for sym in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_KPROBES; do
            grep -qx "$sym=y" out/.config || { echo "::error::$sym=y missing"; exit 1; }
          done

      - name: Collect artifacts
        run: |
          mkdir -p artifact
          cp kernel/out/arch/arm64/boot/Image artifact/Image
          cp kernel/out/arch/arm64/boot/Image.gz artifact/Image.gz || true
          cp kernel/out/.config artifact/kernel.config
          (cd artifact && sha256sum Image > Image.sha256)
          strings artifact/Image | grep -m3 'Linux version' || true

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: odin-sukisu-kernel
          path: artifact/*
          if-no-files-found: error

      - name: Package AnyKernel3
        run: |
          set -e
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git ak3
          cd ak3
          rm -rf .git .github patch README.md
          mkdir -p patch
          cp ../kernel/out/arch/arm64/boot/Image .

          if [ "${{ inputs.embed_ksud }}" = "true" ]; then
            # main has no release asset; use the newest published ksud.  A
            # main kernel reports a higher KSU_VERSION, which the tagged
            # ksud accepts, so this remains a valid combination.
            KSREF="${{ inputs.sukisu_ref || 'v4.3.0-r2' }}"
            if [ "$KSREF" = "main" ]; then KSREF="v4.3.0-r2"; fi
            KSURL="https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases/download/$KSREF/ksud-aarch64-linux-android"
            curl -fL --retry 3 --connect-timeout 20 -o ./ksud "$KSURL"
            chmod 755 ./ksud
            echo "ksud embedded: $(stat -c %s ./ksud) bytes"
            echo "KSUD_EMBED=true" >> "$GITHUB_ENV"
          else
            echo "KSUD_EMBED=false" >> "$GITHUB_ENV"
          fi

          cat ../ci/scripts/ak3-ksud.sh >> anykernel.sh

          BUILD_STAMP=$(date -u +%Y%m%d-%H%MZ)
          cat >> anykernel.sh <<AK3EOF

          ui_print " ";
          ui_print "  odin (Xiaomi MIX 4) SukiSU-Ultra kernel";
          ui_print "  kernel : 5.4.302-$NEKO_VER";
          ui_print "  build  : $BUILD_STAMP UTC";
          ui_print "  root   : SukiSU-Ultra ${{ inputs.sukisu_ref || 'v4.3.0-r2' }} (KSU $KSU_VERSION)";
          ui_print "  susfs  : v2.1.0 (basic; newest manager toggles may be unsupported)";
          ui_print "  ksud   : embedded";
          ui_print "  source : kernel_xiaomi_odin @ resukisu";
          ui_print "  note   : boot only; vendor_boot modules untouched";
          ui_print " ";
          AK3EOF

          sed -i "s/^kernel.string=.*/kernel.string=odin-SukiSU 5.4.302-$NEKO_VER/" anykernel.sh
          sed -i "s/^device.name1=.*/device.name1=odin/" anykernel.sh
          sed -i "s/^device.name2=.*/device.name2=/" anykernel.sh
          sed -i "s/^device.name3=.*/device.name3=/" anykernel.sh
          sed -i "s/^device.name4=.*/device.name4=/" anykernel.sh
          sed -i "s/^device.name5=.*/device.name5=/" anykernel.sh
          sed -i "s#^BLOCK=.*#BLOCK=/dev/block/bootdevice/by-name/boot;#" anykernel.sh
          sed -i "s/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=1;/" anykernel.sh
          sed -i '/^backup_file /d;/^replace_string /d;/^insert_line /d;/^append_file /d;/^patch_fstab /d' anykernel.sh
          chmod +x anykernel.sh

          NAME="odin-SukiSU-$(date +%Y%m%d)-run${GITHUB_RUN_NUMBER}"
          zip -r9 "../${NAME}.zip" . -x '*.git*' > /dev/null
          cd ..
          ls -lh ./*.zip
          echo "AK3_NAME=${NAME}" >> "$GITHUB_ENV"

      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: odin-sukisu-test-${{ github.run_number }}
          name: odin SukiSU-Ultra test build
          body: |
            odin (Xiaomi MIX 4) SukiSU-Ultra v4.3.0-r2 - TEST BUILD

            NOT VERIFIED ON DEVICE. Flash at your own risk.

            - Kernel 5.4.302-${{ env.NEKO_VER }}, ZyC clang 14.0.6
            - Kernel source: Inkypen79/kernel_xiaomi_odin @ resukisu
            - SukiSU-Ultra: ${{ inputs.sukisu_ref || 'v4.3.0-r2' }}, KSU version ${{ env.KSU_VERSION }}
            - SUSFS: odin in-tree v2.1.0 (basic; SET_PRIORITY_UID_FILTER unavailable)
            - 5.4 shims: SELinux policy, sepolicy dup, selinux_hide, block-PMD
            - Package: AnyKernel3 zip (boot partition, device odin)
            - ksud embedded: ${{ env.KSUD_EMBED || 'false' }}

            Install: flash in TWRP or a kernel flasher app.
            Manager: SukiSU-Ultra v4.3.0-r2 (com.sukisu.ultra).
            Rollback: keep a stock boot.img backup.
          files: ${{ github.workspace }}/${{ env.AK3_NAME }}.zip
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
